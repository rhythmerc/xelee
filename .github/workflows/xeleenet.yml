name: XeleeNet

# Tests tools/xeleenet (the lobby service) on every push that touches it, and
# builds the Linux binaries (amd64, arm64) as a workflow artifact. Deploying
# is a copy of that binary to whatever host runs it (tools/xeleenet/README.md).
on:
  push:
    paths: ['tools/xeleenet/**', 'tools/xn_cli.py', '.github/workflows/xeleenet.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: xeleenet-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test the lobby service
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: tools/xeleenet/go.mod
          cache-dependency-path: tools/xeleenet/go.sum
      - name: Vet
        working-directory: tools/xeleenet
        run: |
          test -z "$(gofmt -l .)" || { gofmt -d .; exit 1; }
          go vet ./...
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install cryptography
        run: python -m pip install cryptography
      - name: End-to-end test
        run: python tools/xeleenet/test_service.py

  build:
    name: Build the lobby service
    needs: test
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: tools/xeleenet/go.mod
          cache-dependency-path: tools/xeleenet/go.sum
      - name: Build
        working-directory: tools/xeleenet
        env:
          CGO_ENABLED: '0'
        run: |
          for arch in amd64 arm64; do
            GOARCH=$arch go build -trimpath -ldflags=-s -o "dist/xeleenet-linux-$arch" .
          done
      - uses: actions/upload-artifact@v4
        with:
          name: xeleenet
          path: tools/xeleenet/dist/
