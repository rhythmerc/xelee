name: Quest

# Xelee's builds: the Meta Quest mixed-reality APK and the Linux x86-64
# AppImage (Steam Deck and desktop). A push to main builds and keeps them as
# artifacts; a v* tag on main also publishes them as a GitHub release, which
# the launchers' updater installs from (src/pc/updater.cpp looks for
# Xelee-Quest-arm64.apk, Xelee-x86_64.AppImage and xelee-linux-x86_64.tar.gz).
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref_type != 'tag' }}

jobs:
  quest:
    name: Quest APK
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    env:
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      CCACHE_MAXSIZE: 3G
      # Dawn and the other C/C++ targets; the decomp keeps its own launcher
      # (tools/gcc_launcher.py, the aarch64 GCC).
      CMAKE_C_COMPILER_LAUNCHER: ccache
      CMAKE_CXX_COMPILER_LAUNCHER: ccache
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install build dependencies
        run: |
          sudo apt-get update
          # The decomp needs scalar_storage_order, which the NDK's Clang does
          # not implement, so tools/gcc_launcher.py routes melee_game through
          # this cross compiler with the NDK sysroot.
          sudo apt-get install -y --no-install-recommends \
            ninja-build cmake ccache gcc-aarch64-linux-gnu
          # nod has no Android prebuilt, so aurora builds it from Rust source.
          rustup target add aarch64-linux-android
          # r26 for the game (newer NDK libc++ has no std::jthread), r29 for
          # Dawn, which tools/build_android.sh picks up by itself.
          "${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager" --install \
            'ndk;26.3.11579264' 'ndk;29.0.14206865' > /dev/null

      - name: Dawn's pinned commit
        id: dawn
        run: echo "ref=$(sed -n 's/.*MELEE_DAWN_REF:-\([0-9a-f]*\)}.*/\1/p' tools/build_android.sh)" >> "$GITHUB_OUTPUT"

      # Dawn from source (the melee-xr fork) with its dependencies: fetched
      # once per pinned commit.
      - uses: actions/cache@v4
        with:
          path: build/dawn-src
          key: dawn-src-${{ steps.dawn.outputs.ref }}

      - uses: actions/cache@v4
        with:
          path: .ccache
          key: quest-ccache-${{ steps.dawn.outputs.ref }}-${{ github.sha }}
          restore-keys: quest-ccache-${{ steps.dawn.outputs.ref }}-

      - name: Build APK
        env:
          MELEE_XR: '1'
          MELEE_VERSION: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
          MELEE_KEYSTORE_BASE64: ${{ secrets.MELEE_KEYSTORE_BASE64 }}
          MELEE_KEYSTORE_PASSWORD: ${{ secrets.MELEE_KEYSTORE_PASSWORD }}
          MELEE_KEY_ALIAS: ${{ secrets.MELEE_KEY_ALIAS }}
          MELEE_KEY_PASSWORD: ${{ secrets.MELEE_KEY_PASSWORD }}
          # Slippi's in-app login, compiled in (CMakeLists.txt).
          MELEE_SLIPPI_FIREBASE_KEY: ${{ secrets.MELEE_SLIPPI_FIREBASE_KEY }}
          MELEE_SLIPPI_GRAPHQL_ENDPOINT: ${{ secrets.MELEE_SLIPPI_GRAPHQL_ENDPOINT }}
          # Where Send logs uploads (CMakeLists.txt, tools/log-drop).
          XELEE_LOGS_URL: ${{ secrets.XELEE_LOGS_URL }}
          # The XeleeNet lobby service (CMakeLists.txt, tools/xeleenet).
          XELEENET_URL: ${{ vars.XELEENET_URL }}
        run: |
          # A release without them would say "Online login is not configured".
          if [[ "${GITHUB_REF_TYPE}" == tag && ( -z "${MELEE_SLIPPI_FIREBASE_KEY}" || -z "${MELEE_SLIPPI_GRAPHQL_ENDPOINT}" ) ]]; then
            echo "::error::MELEE_SLIPPI_FIREBASE_KEY and MELEE_SLIPPI_GRAPHQL_ENDPOINT secrets are required for a release"
            exit 1
          fi
          # Without it Send logs still saves the bundle as a file.
          if [[ "${GITHUB_REF_TYPE}" == tag && -z "${XELEE_LOGS_URL}" ]]; then
            echo "::warning::no XELEE_LOGS_URL secret: this release's Send logs saves files only"
          fi
          if [[ "${GITHUB_REF_TYPE}" == tag && -z "${XELEENET_URL}" ]]; then
            echo "::warning::no XELEENET_URL variable: this release has no XeleeNet service"
          fi
          export ANDROID_NDK_HOME="${ANDROID_HOME}/ndk/26.3.11579264"
          export MELEE_XR_NDK_HOME="${ANDROID_HOME}/ndk/29.0.14206865"
          ccache --zero-stats
          tools/build_android.sh
          ccache --show-stats

      - uses: actions/upload-artifact@v4
        with:
          name: xelee-quest
          path: dist/Xelee-Quest-arm64.apk
          if-no-files-found: error

  linux:
    name: Linux AppImage
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      CCACHE_MAXSIZE: 2G
      CMAKE_C_COMPILER_LAUNCHER: ccache
      CMAKE_CXX_COMPILER_LAUNCHER: ccache
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - name: Install build dependencies
        run: |
          sudo apt-get update
          # build.yml's linux job, plus ccache. SDL3 is not in Ubuntu 24.04,
          # so aurora builds it from source (AURORA_SDL3_PROVIDER=vendor);
          # these are its X11/Wayland/audio deps.
          sudo apt-get install -y --no-install-recommends \
            build-essential ninja-build cmake pkg-config ccache \
            libssl-dev libcurl4-openssl-dev zip file desktop-file-utils \
            libx11-dev libxext-dev libxrandr-dev libxcursor-dev libxi-dev \
            libxfixes-dev libxss-dev libxkbcommon-dev libxtst-dev \
            libwayland-dev wayland-protocols libdecor-0-dev \
            libasound2-dev libpulse-dev libdbus-1-dev libudev-dev \
            libgl1-mesa-dev libegl1-mesa-dev libgbm-dev \
            libusb-1.0-0-dev

      - uses: actions/cache@v4
        with:
          path: .ccache
          key: linux-ccache-${{ github.sha }}
          restore-keys: linux-ccache-

      - name: Build AppImage
        env:
          MELEE_VERSION: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
          MELEE_SLIPPI_FIREBASE_KEY: ${{ secrets.MELEE_SLIPPI_FIREBASE_KEY }}
          MELEE_SLIPPI_GRAPHQL_ENDPOINT: ${{ secrets.MELEE_SLIPPI_GRAPHQL_ENDPOINT }}
          XELEE_LOGS_URL: ${{ secrets.XELEE_LOGS_URL }}
        run: |
          # The quest job checks the secrets a release needs.
          ccache --zero-stats
          tools/package_linux.sh
          ccache --show-stats

      - name: Smoke test (disc-free subset)
        run: python3 tools/smoke_test.py --no-disc

      - uses: actions/upload-artifact@v4
        with:
          name: xelee-linux
          path: |
            dist/Xelee-x86_64.AppImage
            dist/xelee-linux-x86_64.tar.gz
          if-no-files-found: error

  release:
    name: Publish release
    needs: [quest, linux]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: xelee-quest
          path: artifacts

      - uses: actions/download-artifact@v4
        with:
          name: xelee-linux
          path: artifacts

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # A tag containing a hyphen (v0.1.0-beta) is a prerelease.
          prerelease=""
          [[ "${GITHUB_REF_NAME}" == *-* ]] && prerelease="--prerelease"
          gh release create "${GITHUB_REF_NAME}" \
            --title "Xelee ${GITHUB_REF_NAME}" \
            --notes-file .github/QUEST_RELEASE_NOTES.md \
            --generate-notes \
            ${prerelease} \
            artifacts/Xelee-Quest-arm64.apk \
            artifacts/Xelee-x86_64.AppImage \
            artifacts/xelee-linux-x86_64.tar.gz
