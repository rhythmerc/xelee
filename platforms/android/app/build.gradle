plugins {
    id 'com.android.application'
}

// Release signing: CI decodes MELEE_KEYSTORE_BASE64 into this file, and
// tools/build_android.sh requires one to exist before building.
def releaseKeystore = rootProject.file('melee-release.keystore')

// -Pmelee.xr=true (tools/build_android.sh with MELEE_XR=1): Meta Quest
// mixed-reality build. Merges src/xr/AndroidManifest.xml over the main one.
def meleeXr = (project.findProperty('melee.xr') ?: 'false').toString().toBoolean()

// -Pmelee.asan=true: AddressSanitizer build (debug only). libmelee.so must be
// built with -fsanitize=address; src/asan adds wrap.sh, which preloads the
// ASan runtime the build stages next to it (src/asan/jniLibs, untracked).
def meleeAsan = (project.findProperty('melee.asan') ?: 'false').toString().toBoolean()

// -Pmelee.cleartext=true: allow plain http://, for tools/xn_trial.py's lobby
// service on a desktop (XeleeNet's real one is HTTPS). Local trial builds only.
def meleeCleartext = (project.findProperty('melee.cleartext') ?: 'false').toString().toBoolean()

def meleeVersion = (System.getenv('MELEE_VERSION') ?: '0.1.0-beta').replaceFirst(/^v/, '')
def meleeVersionCode = {
    def m = (meleeVersion =~ /^(\d+)\.(\d+)\.(\d+)/)
    m.find() ? m.group(1).toInteger() * 1000000 + m.group(2).toInteger() * 1000 + m.group(3).toInteger() + 100 : 100
}()

android {
    namespace 'dev.melee.game'
    compileSdk 34

    defaultConfig {
        applicationId 'dev.melee.game'
        minSdk 26
        targetSdk 34
        // From the release tag (MELEE_VERSION, v0.1.0-beta): an update must
        // not have a lower code than what it replaces. major.minor.patch as
        // MMmmmppp, plus 100 to stay above melee-pc's fixed 12.
        versionCode meleeVersionCode
        versionName meleeVersion
        manifestPlaceholders = [usesCleartextTraffic: meleeCleartext.toString()]

        ndk {
            abiFilters 'arm64-v8a'
        }
    }

    signingConfigs {
        release {
            if (releaseKeystore.exists()) {
                storeFile releaseKeystore
                storePassword System.getenv('MELEE_KEYSTORE_PASSWORD')
                keyAlias System.getenv('MELEE_KEY_ALIAS') ?: 'melee'
                keyPassword System.getenv('MELEE_KEY_PASSWORD')
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            signingConfig releaseKeystore.exists() ? signingConfigs.release : null
        }
        debug {
            debuggable true
        }
    }

    if (meleeXr) {
        sourceSets {
            debug.manifest.srcFile 'src/xr/AndroidManifest.xml'
            release.manifest.srcFile 'src/xr/AndroidManifest.xml'
        }
    }

    if (meleeAsan) {
        sourceSets {
            debug.jniLibs.srcDirs += 'src/asan/jniLibs'
            debug.resources.srcDirs += 'src/asan/resources'
        }
        // wrap.sh runs only from libraries extracted at install.
        packaging {
            jniLibs.useLegacyPackaging true
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation fileTree(dir: 'libs', include: ['*.jar'])
}
