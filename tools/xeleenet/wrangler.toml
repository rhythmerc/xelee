# XeleeNet, the lobby service (README.md, docs/xeleenet-plan.md §3.1).
# Secrets, set with `wrangler secret put` (or from CI, .github/workflows/xeleenet.yml):
# TOKEN_KEY (signs session tokens; any long random string) and, optionally,
# NAME_BLOCKLIST (comma-separated words refused in player and lobby names).
name = "xeleenet"
main = "src/index.js"
compatibility_date = "2026-09-01"

[vars]
# Seconds without a host heartbeat before a lobby closes.
EXPIRE_SECS = "30"
# Longest a joiner's request waits on "Ask before joining" before it answers
# "pending" (the joiner asks again).
JOIN_WAIT_SECS = "20"
# A new member the host's heartbeat doesn't list yet is kept this long: the
# host only lists players its game has reached.
ROSTER_GRACE_SECS = "20"

[[durable_objects.bindings]]
name = "LOBBY"
class_name = "Lobby"

[[durable_objects.bindings]]
name = "DIRECTORY"
class_name = "Directory"

# The free plan runs only SQLite-backed Durable Objects.
[[migrations]]
tag = "v1"
new_sqlite_classes = ["Lobby", "Directory"]

# Per client IP, every call.
[[ratelimits]]
name = "PER_IP"
namespace_id = "2001"

  [ratelimits.simple]
  limit = 120
  period = 60

# Per player key: creating lobbies.
[[ratelimits]]
name = "HOSTS"
namespace_id = "2002"

  [ratelimits.simple]
  limit = 6
  period = 60

# Per client IP: joining by code, so codes can't be guessed by brute force.
[[ratelimits]]
name = "JOINS"
namespace_id = "2003"

  [ratelimits.simple]
  limit = 20
  period = 60
